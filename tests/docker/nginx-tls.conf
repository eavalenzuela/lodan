# Plain HTTP on 80 and TLS on 443 with the self-signed cert the conftest
# fixture generates into ./certs. Both return a tiny body so the HTTP probe
# has a 200 + Server: nginx header to parse.
server {
    listen 80 default_server;
    server_name _;
    location / {
        default_type text/plain;
        return 200 "lodan-itest plain\n";
    }
}

server {
    listen 443 ssl default_server;
    server_name _;
    ssl_certificate     /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;
    location / {
        default_type text/plain;
        return 200 "lodan-itest tls\n";
    }
}
